# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls.

name = "hyz-is/piper"
framework = ">= 0.50"
profiles = ["conventional", "performance"]

[permissions]
# Speech is made on the application's own server. Nothing leaves the process by
# the network: no text, no audio, no telemetry.
network = false
# Each call writes the audio Piper makes (and the Opus file, when asked) to a
# private temporary directory (Config.TempDir), reads it back, and removes the
# directory before returning. Piper also reads the configured voice files.
filesystem = true
# It starts piper, and ffmpeg for Opus, by the paths in Config, without a shell
# and with fixed arguments.
exec = true
# It owns no table.
migrations = false
